<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MINED | Detalle de universidad</title>
    <link rel="stylesheet" href="/css/mined.css">
    <link rel="stylesheet" href="/css/mined-universidades.css">
</head>

<body>
    <div class="dashboard">
        <aside class="sidebar">
            <div class="logo">
                <div class="logo-icon">↗</div>
                <div>
                    <strong>SEDA</strong>
                    <small>Sistema de Equivalencias y Documentación Académica</small>

            <nav>
                <a href="/mined.html">Dashboard</a>
                <a href="/mined.html#equivalencias">Equivalencias</a>
                <a href="/mined-universidades.html" class="active" aria-current="page">
                    Universidades
                </a>
            </nav>

            <div class="user">
                <div class="user-icon">M</div>
                <div>
                    <strong>MINED</strong>
                    <small>Administrador</small>

        </aside>

        <main class="content">

                    <h1 id="tituloUniversidad">Detalle de universidad</h1>

            <p id="estadoDetalle" role="status" aria-live="polite">

    <script src="/js/mined-universidad.js"></script>
