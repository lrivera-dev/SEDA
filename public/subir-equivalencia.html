<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SEDA | Registro de equivalencia</title>
    <link rel="stylesheet" href="css/subir-equivalencia.css">
    <script src="/js/proteger-universidad.js"></script>
</head>

<body>
    <div class="contenedor">
        <a class="enlace-volver" href="/equivalencias.html">
            ← Volver a equivalencias registradas
        </a>
        <h1>Registro de equivalencia</h1>
        <p class="lead">Registra las materias que se reconocen como equivalentes. Los campos con <span
                class="req">*</span> son obligatorios.</p>

        <!--Inicio de equivalencia manual-->
        <form id="form-equivalencia" class="card" novalidate>
            <h2>Datos del estudiante y solicitud</h2>

            <div class="grid">
                <div class="field">
                    <label for="nombre-estudiante">
                        Nombre del estudiante <span class="req">*</span>
                    </label>
                    <input id="nombre-estudiante" type="text" maxlength="200" autocomplete="name">
                </div>

                <div class="field">
                    <label for="codigo-institucional">
                        Código institucional <span class="req">*</span>
                    </label>
                    <input id="codigo-institucional" type="text" maxlength="100">
                </div>
            </div>

            <div class="field">
                <label for="modalidad-equivalencia">
                    Modalidad <span class="req">*</span>
                </label>
                <select id="modalidad-equivalencia">
                    <option value="AUTOMATICA">Automática con análisis de IA</option>
                    <option value="MANUAL">Manual, con porcentaje propuesto</option>
                </select>
                <small id="ayuda-modalidad">
                    SEDA calculará el porcentaje y generará el análisis con IA.
                </small>
            </div>

            <h2>Materias de la solicitud</h2>

            <div id="eq-filas" class="filas"></div>

            <button type="button" class="btn-sec" id="btn-agregar-fila">
                + Agregar materia
            </button>

            <p class="error" id="error-equivalencia" role="alert"></p>

            <button type="submit" class="btn" id="btn-guardar-eq">
                Registrar solicitud
            </button>

            <div class="status" id="status-equivalencia" role="status" aria-live="polite"></div>
        </form>

        <template id="tpl-fila">
            <div class="fila">
                <div class="fila-cabecera">
                    <strong>Equivalencia</strong>
                    <button type="button" class="btn-quitar">Eliminar</button>
                </div>

                <div class="fila-origen">
                    <div class="field">
                        <label>Carrera de nuestra universidad <span class="req">*</span></label>
                        <select class="f-carrera-origen" required>
                            <option value="">Cargando carreras...</option>
                        </select>
                    </div>

                    <div class="field">
                        <label>Materia cursada <span class="req">*</span></label>
                        <select class="f-origen" required disabled>
                            <option value="">Primero selecciona una carrera</option>
                        </select>
                    </div>
                </div>

                <div class="fila-destino">
                    <div class="field">
                        <label>Universidad a comparar <span class="req">*</span></label>
                        <select class="f-universidad-destino" required>
                            <option value=""><option value="">Selecciona una universidad para comparar</option></option>
                        </select>
                    </div>

                    <div class="field">
                        <label>Carrera a comparar <span class="req">*</span></label>
                        <select class="f-carrera-destino" required disabled>
                            <option value="">Primero selecciona una universidad</option>
                        </select>
                    </div>

                    <div class="field">
                        <label>Materia a comparar <span class="req">*</span></label>
                        <select class="f-destino" required disabled>
                            <option value="">Primero selecciona una carrera</option>
                        </select>
                    </div>
                </div>

                <div class="fila-nota">
                    <div class="field">
                        <label>
                            Nota obtenida en la materia cursada <span class="req">*</span>
                        </label>
                        <input class="f-nota-obtenida" type="number" min="0" step="0.01" placeholder="Ej. 8.5" required>
                    </div>

                    <div class="field">
                        <label>
                            Nota máxima de la escala <span class="req">*</span>
                        </label>
                        <input class="f-nota-maxima" type="number" min="0.01" step="0.01" placeholder="Ej. 10" required>
                    </div>

                    <small>Registra la nota de esta materia, por ejemplo: 8.5 de 10.</small>
                </div>

                <div class="field datos-manuales" hidden>
                    <label>
                        Porcentaje propuesto por la universidad
                        <span class="req">*</span>
                    </label>
                    <input class="f-porcentaje-propuesto" type="number" min="0" max="100" step="0.01"
                        placeholder="0 a 100">
                    <small>Es una propuesta de la universidad; no es la decisión del MINED.</small>

                    <label>
                        Justificación académica <span class="req">*</span>
                    </label>
                    <textarea class="f-justificacion-manual" rows="3" minlength="10" maxlength="500"></textarea>
                    <small>Explica cómo los documentos respaldan el porcentaje propuesto.</small>
                </div>

                <small class="error fila-error"></small>
            </div>
        </template>
        <!--Fin equivalencia manual-->
    </div>

    <script src="js/subir-equivalencia.js"></script>
</body>

</html>
