<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SEDA | Registro de equivalencia</title>
    <link rel="stylesheet" href="css/subir-equivalencia.css">
    <script src="/js/proteger-universidad.js"></script>
</head>

<body>
    <div class="contenedor">
        <h1>Registro de equivalencia</h1>
        <p class="lead">Registra las materias que se reconocen como equivalentes. Los campos con <span
                class="req">*</span> son obligatorios.</p>

        <!--Inicio de equivalencia manual-->
        <form id="form-equivalencia" class="card" novalidate>
            <h2>Equivalencia por materia</h2>
            <div id="eq-filas" class="filas"></div>
            <button type="button" class="btn-sec" id="btn-agregar-fila">+ Agregar materia</button>


            <p class="error" id="error-equivalencia" role="alert"></p>
            <button type="submit" class="btn" id="btn-guardar-eq">Guardar</button>
            <div class="status" id="status-equivalencia" role="status" aria-live="polite"></div>
        </form>

        <template id="tpl-fila">
            <div class="fila">
                <div class="fila-cabecera">
                    <strong>Equivalencia</strong>
                    <button type="button" class="btn-quitar">Eliminar</button>
                </div>

                <div class="fila-origen">
                    <div class="field">
                        <label>Carrera de nuestra universidad <span class="req">*</span></label>
                        <select class="f-carrera-origen" required>
                            <option value="">Cargando carreras...</option>
                        </select>
                    </div>

                    <div class="field">
                        <label>Materia cursada <span class="req">*</span></label>
                        <select class="f-origen" required disabled>
                            <option value="">Primero selecciona una carrera</option>
                        </select>
                    </div>
                </div>

                <div class="fila-destino">
                    <div class="field">
                        <label>Universidad destino <span class="req">*</span></label>
                        <select class="f-universidad-destino" required>
                            <option value="">Selecciona una universidad</option>
                        </select>
                    </div>

                    <div class="field">
                        <label>Carrera destino <span class="req">*</span></label>
                        <select class="f-carrera-destino" required disabled>
                            <option value="">Primero selecciona una universidad</option>
                        </select>
                    </div>

                    <div class="field">
                        <label>Materia destino <span class="req">*</span></label>
                        <select class="f-destino" required disabled>
                            <option value="">Primero selecciona una carrera</option>
                        </select>
                    </div>
                </div>

                <div class="field f-desc">
                    <label>Descripción de la equivalencia <span class="req">*</span></label>
                    <textarea class="f-descripcion" rows="2" maxlength="500"></textarea>
                </div>

                <small class="error fila-error"></small>
            </div>
        </template>
        <!--Fin equivalencia manual-->
    </div>

    <script src="js/subir-equivalencia.js"></script>
</body>

</html>
