<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso al Sistema</title>
  <link rel="stylesheet" href="css/index.css">
</head>

<body>

  <main class="login-container">

    <div class="logo">
      <div class="logo-icon">↗</div>
      <div>
        <strong>MINED-IA</strong>
        <small>Equivalencias Académicas</small>
      </div>
    </div>

    <h1>Acceso al Sistema</h1>

    <p class="label">PERFIL DE ACCESO</p>

    <div class="profiles">

      <!-- Universidad -->
      <label class="profile">
        <input type="radio" name="perfil" value="universidad" checked>

        <svg class="profile-icon" viewBox="0 0 24 24">
          <path d="M2 9l10-5 10 5-10 5L2 9z"/>
          <path d="M6 11v5c3 2 9 2 12 0v-5"/>
          <path d="M20 10v6"/>
        </svg>

        <span class="check">✓</span>

        <h2>Universidad</h2>
        <p>Gestión de pénsum y solicitudes institucionales</p>
      </label>

      <!-- Ministerio -->
      <label class="profile">
        <input type="radio" name="perfil" value="ministerio">

        <svg class="profile-icon" viewBox="0 0 24 24">
          <path d="M3 21h18"/>
          <path d="M5 21V10"/>
          <path d="M9 21V10"/>
          <path d="M15 21V10"/>
          <path d="M19 21V10"/>
          <path d="M2 10h20L12 4 2 10z"/>
        </svg>

        <span class="check">✓</span>

        <h2>Ministerio de Educación</h2>
        <p>Validación y homologación nacional</p>
      </label>

    </div>

    <form action="universidades.html">

      <label for="email">Correo electrónico institucional</label>

      <div class="input">
        <span>@</span>

        <input
          type="email"
          id="email"
          placeholder="usuario@universidad.edu.sv"
        >
      </div>

      <label for="password">Contraseña</label>

      <div class="input">
        <span>♙</span>

        <input
          type="password"
          id="password"
          placeholder="••••••••••••"
        >

        <span>◉</span>
      </div>

      <button type="submit">
        Ingresar →
      </button>

    </form>

    <div class="register">
      <span>¿Tu universidad aún no está registrada?</span>
      <a href="registro.html">Registrarse como universidad</a>
    </div>

  </main>

</body>
</html>
