<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso al Sistema</title>
  <link rel="stylesheet" href="css/index.css">
</head>

<body>

  <main class="login-container">

    <div class="logo">
      <div class="logo-icon">↗</div>
      <div>
        <strong>SEDA</strong>
        <small>Sistema de Equivalencias y Documentación Académica</small>
      </div>
    </div>

    <h1>Acceso al Sistema</h1>

    <form id="loginForm">
      <label for="email">Correo electrónico institucional</label>

      <div class="input">
        <span>@</span>
        <input type="email" id="email" name="correo" placeholder="Ingresa tu correo institucional"
          autocomplete="username" required>
      </div>

      <label for="password">Contraseña</label>

      <div class="input">
        <span>♙</span>
        <input type="password" id="password" name="contrasena" placeholder="••••••••••••"
          autocomplete="current-password" required>
      </div>

      <p id="loginError" role="alert" hidden></p>

      <button id="loginButton" type="submit">
        Ingresar →
      </button>
    </form>
    
    <div class="register">
      <span>¿Tu universidad aún no está registrada?</span>
      <a href="registro.html">Registrarse como universidad</a>
    </div>

  </main>

  <script src="js/login.js"></script>
</body>

</html>
