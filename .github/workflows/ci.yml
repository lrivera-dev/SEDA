name: CI

on:
  pull_request:
    branches: [development, staging, main]
  push:
    branches: [development, staging, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verificar:
    name: Verificar proyecto
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verificar que .env no esté en el repositorio
        id: entorno
        run: |
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "::error::El archivo .env está versionado. Quítalo del repositorio y agrégalo a .gitignore."
            exit 1
          fi

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        id: dependencias
        run: npm ci

      - name: Lint (si existe el script)
        id: lint
        run: npm run lint --if-present

      - name: Build (si existe el script)
        id: build
        if: ${{ !cancelled() && steps.dependencias.outcome == 'success' }}
        run: npm run build --if-present

      - name: Verificar aislamiento de Supabase
        id: aislamiento
        if: ${{ !cancelled() && steps.entorno.outcome == 'success' && steps.dependencias.outcome == 'success' }}
        run: npm run test:isolation

      - name: Verificar carga controlada sin servicios externos
        id: carga
        if: ${{ !cancelled() && steps.aislamiento.outcome == 'success' }}
        run: npm run test:load

      - name: Pruebas Hachi e informes QA (unitarias y API)
        id: regresion
        if: ${{ !cancelled() && steps.aislamiento.outcome == 'success' && steps.carga.outcome == 'success' }}
        run: npm run test:qa

      - name: Publicar informes y evidencia QA
        id: artefactos
        if: ${{ always() && (steps.regresion.outcome == 'success' || steps.regresion.outcome == 'failure') }}
        uses: actions/upload-artifact@v4
        with:
          name: hachi-qa-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            qa-output/*/informe.pdf
            qa-output/*/informe.md
            qa-output/*/execution.json
            qa-output/*/results.json
            qa-output/*/report-error.json
            qa-output/*/unit.jsonl
            qa-output/*/api.jsonl
          include-hidden-files: false
          if-no-files-found: error
          retention-days: 14

      - name: Resumir etapas y evidencia sin ocultar fallos
        if: ${{ always() }}
        env:
          INSTALACION: ${{ steps.dependencias.outcome }}
          AISLAMIENTO: ${{ steps.aislamiento.outcome }}
          CARGA: ${{ steps.carga.outcome }}
          REGRESION: ${{ steps.regresion.outcome }}
          ARTEFACTOS: ${{ steps.artefactos.outcome }}
        run: |
          {
            echo '## Hachi: estado de las etapas'
            echo "- Instalación / infraestructura: $INSTALACION"
            echo "- Aislamiento de Supabase: $AISLAMIENTO"
            echo "- Carga controlada: $CARGA"
            echo "- Regresión y generación: $REGRESION"
            echo "- Publicación de artefactos: $ARTEFACTOS"
            echo 'Un fallo de regresión no identifica por sí solo un defecto funcional: revisar results.json (casos FAIL/BLOCKED), execution.json y report-error.json si existe.'
            echo 'Los pasos conservan sus códigos de salida. Publicar un informe no convierte una ejecución fallida en exitosa.'
          } >> "$GITHUB_STEP_SUMMARY"
