name: CI

on:
  pull_request:
    branches: [development, staging, main]
  push:
    branches: [development, staging, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Verificar proyecto
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Verificar que .env no esté en el repositorio
        run: |
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "::error::El archivo .env está versionado. Quítalo del repositorio y agrégalo a .gitignore."
            exit 1
          fi

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        id: dependencias
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Lint (si existe el script)
        run: npm run lint --if-present

      - name: Build (si existe el script)
        run: npm run build --if-present

      - name: Pruebas Hachi e informes QA (unitarias y API)
        if: ${{ !cancelled() && steps.dependencias.outcome == 'success' }}
        run: npm run test:qa

      - name: Publicar informes y evidencia QA
        if: ${{ always() && steps.dependencias.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: hachi-qa-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            qa-output/**/*.pdf
            qa-output/**/*.md
            qa-output/**/*.json
            qa-output/**/*.jsonl
          if-no-files-found: error
          retention-days: 14
